tuti:
  base_url: https://tuti.com.ec
  # Tuti no separa alimentos: se recorre el catálogo y se filtra por palabras.
  listados:
    - /nuestros-productos

supermaxi:
  base_url: https://www.supermaxi.com
  # Categorías raíz de alimentos (WooCommerce). El scraper usa el sitemap
  # de productos y descarta los que no pertenecen a estas raíces.
  food_roots:
    - abarrotes
    - alacena
    - alimentos-congelados
    - alimentos-frescos
    - charcuteria-y-comidas-preparadas
    - jugos-y-bebidas
    - lacteos
    - panaderia
    - pasteleria-y-reposteria
    - proteinas
    - salsas-y-condimentos
    - snacks
    - snacks-y-bebidas
    - cafe

megamaxi:
  base_url: https://www.megamaxi.com
  food_roots:
    - alacena
    - alimentos-congelados
    - botanas-snacks
    - cafe
    - charcuteria-y-comidas-preparadas
    - chocolates-snacks
    - condimentos-salsas-y-condimentos
    - dips-salsas-y-aderezos-salsas-y-condimentos
    - dulces-snacks
    - frutas-en-conserva-reposteria-pasteleria-y-reposteria
    - galletas-y-poncakes-snacks
    - jugos-y-bebidas
    - lacteos
    - mayonesas-salsas-y-aderezos-salsas-y-condimentos
    - mostazas-salsas-y-aderezos-salsas-y-condimentos
    - panaderia
    - pasteleria-y-reposteria
    - proteinas
    - salsas-y-condimentos
    - snacks

# Filtro por nombre de producto (se usa en Tuti y como red de seguridad en el resto).
filtro_alimentos:
  excluir_palabras:
    - detergente
    - jabon
    - shampoo
    - acondicionador
    - suavizante
    - desinfectante
    - limpiador
    - lavavajilla
    - cloro
    - papel higienico
    - toalla
    - panal
    - desodorante
    - crema dental
    - cepillo
    - insecticida
    - juguete
    - bolsa de basura
    - servilleta
    - vaso desechable
    - maquillaje
  alcohol:
    - cerveza
    - vino
    - whisky
    - ron
    - vodka
    - aguardiente
    - tequila
    - licor
  mascotas:
    - perro
    - gato
    - mascota
    - cachorro
  revisar_palabras:    # casos dudosos: se incluyen pero con revisar=true
    - suplemento
    - vitamina
    - bolsa
    - envase
    - empaque
